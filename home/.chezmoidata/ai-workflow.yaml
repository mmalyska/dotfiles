# Static data for the AI workflow adoption (see docs/plans/hybrid-ai-workflow-dotfiles/).
# The workflow itself (lifecycle, profiles, topologies) is owned by mmalyska/claude-plugins;
# this file only describes what dotfiles installs and which revision was accepted.
ai_workflow:
  marketplace:
    own:
      name: mmalyska-claude-plugins
      repo: mmalyska/claude-plugins
      # Accepted revision, see docs/workflow/acceptance.md. Codex pins it natively (--ref);
      # Claude Code cannot pin a SHA, so it is verified (pin_mode: verify).
      accepted_sha: 1a0724307063084cc05de58096032dee2c00490a
      # Tag of the accepted revision. Recorded only; pin_mode decides how it is enforced.
      accepted_tag: ai-workflow-v0.1.1
      pin_mode: verify
    official:
      name: claude-plugins-official
      repo: anthropics/claude-plugins-official
  plugins:
    # Minimal set: canonical lifecycle + worktree-first.
    workflow:
      - git-workflows
      - development-lifecycle
    own:
      - personal-essentials
      - git-workflows
      - development-lifecycle
      - dotnet
      - frontend
      - backend
      - devops
      - security
      - agent-toolkit
      - renovate
      - devcontainer
      - android
    # Optional Claude-only extras (claude-plugins-official).
    claude_extras:
      - superpowers
      - code-simplifier
      - context7
      - claude-md-management
  profiles:
    minimal:
      own_set: workflow
      extras: false
    core:
      own_set: own
      extras: false
    claude-extended:
      own_set: own
      extras: true
