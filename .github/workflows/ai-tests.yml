name: ai-tests

on:
  pull_request:
    paths:
      - "home/**"
      - "tests/ai/**"
      - ".github/workflows/ai-tests.yml"
      - "docs/workflow/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      AI_REQUIRE_PWSH: "1"
      # renovate: datasource=github-releases depName=twpayne/chezmoi
      CHEZMOI_VERSION: v2.74.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          set -euo pipefail
          f="chezmoi_${CHEZMOI_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$f" "$base/$f"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/chezmoi_${CHEZMOI_VERSION#v}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $f\$" checksums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" chezmoi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          chezmoi --version
          shellcheck --version
      - name: shellcheck
        run: shellcheck -x tests/ai/*.sh tests/ai/stubs/* docs/workflow/backup.sh
      - name: Tests
        run: bash tests/ai/run.sh
      - name: Working tree must stay clean
        run: test -z "$(git status --porcelain)"

  macos:
    runs-on: macos-latest
    env:
      AI_REQUIRE_PWSH: "1"
      # renovate: datasource=github-releases depName=twpayne/chezmoi
      CHEZMOI_VERSION: v2.74.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch=arm64;;
            x86_64) arch=amd64;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1;;
          esac
          f="chezmoi_${CHEZMOI_VERSION#v}_darwin_${arch}.tar.gz"
          base="https://github.com/twpayne/chezmoi/releases/download/${CHEZMOI_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$f" "$base/$f"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/chezmoi_${CHEZMOI_VERSION#v}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $f\$" checksums.txt | shasum -a 256 -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" chezmoi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: GNU coreutils and findutils for the test harness (timeout, sha256sum, find -printf)
        run: |
          set -euo pipefail
          brew install coreutils findutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix findutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          chezmoi --version
          pwsh --version
          command -v shellcheck || brew install shellcheck
          shellcheck --version
      - name: shellcheck
        run: shellcheck -x tests/ai/*.sh tests/ai/stubs/* docs/workflow/backup.sh
      - name: Tests
        run: bash tests/ai/run.sh
      - name: Working tree must stay clean
        run: test -z "$(git status --porcelain)"

  windows:
    runs-on: windows-latest
    env:
      AI_REQUIRE_PWSH: "1"
      # renovate: datasource=github-releases depName=twpayne/chezmoi
      CHEZMOI_VERSION: v2.74.2
    defaults:
      run:
        shell: bash
    steps:
      # LF endings: the ignore/ps1 templates are compared and rendered as checked in
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        shell: pwsh
        run: |
          $f = "chezmoi_$($env:CHEZMOI_VERSION.TrimStart('v'))_windows_amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $f
          $base = "https://github.com/twpayne/chezmoi/releases/download/$($env:CHEZMOI_VERSION)"
          Invoke-WebRequest -Uri "$base/$f" -OutFile $zip
          $sumsFile = Join-Path $env:RUNNER_TEMP 'checksums.txt'
          Invoke-WebRequest -Uri "$base/chezmoi_$($env:CHEZMOI_VERSION.TrimStart('v'))_checksums.txt" -OutFile $sumsFile
          $line = Get-Content -LiteralPath $sumsFile | Where-Object { $_.Trim() -match "^[0-9a-f]{64}\s+$([regex]::Escape($f))$" }
          if (-not $line) { throw "no checksum for $f in the release checksums" }
          $expected = ($line.Trim() -split '\s+')[0]
          if ((Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower() -ne $expected) { throw "chezmoi checksum mismatch" }
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Versions
        run: |
          chezmoi --version
          pwsh --version
          pwsh -NoProfile -Command '(Get-Module -ListAvailable Pester | Select-Object -First 1).Version.ToString()'
      - name: Ignore matrix (.chezmoiignore per OS and devcontainer)
        run: bash tests/ai/test_ignore.sh
      - name: PowerShell installers (parse-check and Pester)
        run: bash tests/ai/test_pwsh.sh
      - name: Working tree must stay clean
        run: test -z "$(git status --porcelain)"
